<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Watch Pet UI V3</title>
  <style>
    :root {
      --bg: #030607;
      --panel: #071014;
      --line: #132b36;
      --text: #edf8ff;
      --muted: #7fa1ad;
      --blue: #2e9cff;
      --green: #5ae29a;
      --amber: #f5b94f;
      --red: #ff5c6b;
      --accent: var(--green);
      --session-left: 89;
      --session-used: 11;
      --pet-row: 0;
      --pet-frames: 6;
      --pet-duration: 1150ms;
      --sprite: url("wear-app/app/src/main/assets/pets/yukino/spritesheet.webp");
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background: #e2e3df;
      color: #182025;
      font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
    }

    .wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 34px;
      flex-wrap: wrap;
    }

    .watch {
      width: 466px;
      height: 466px;
      border-radius: 50%;
      position: relative;
      display: grid;
      place-items: center;
      background: #040505;
      box-shadow:
        inset 0 0 0 10px #171b1c,
        inset 0 0 0 16px #050606,
        0 20px 62px rgba(0,0,0,0.33);
      overflow: hidden;
    }

    .screen {
      width: 392px;
      height: 392px;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 34%, rgba(46,156,255,0.12), transparent 32%),
        var(--bg);
    }

    .ring {
      position: absolute;
      top: 72px;
      left: 50%;
      width: 220px;
      height: 90px;
      translate: -50% 0;
      pointer-events: none;
    }

    .ring svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .ring path {
      fill: none;
      stroke-linecap: round;
      stroke-width: 5;
    }

    .ring-bg {
      stroke: rgba(255, 255, 255, 0.13);
    }

    .ring-used {
      stroke: var(--red);
      stroke-dasharray: var(--session-used) 100;
      filter: drop-shadow(0 0 7px rgba(255, 92, 107, 0.55));
    }

    .top {
      position: absolute;
      top: 32px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 12px;
      line-height: 1;
    }

    .brand {
      color: var(--blue);
      font-size: 17px;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(46,156,255,0.55);
    }

    .hero {
      position: absolute;
      top: 76px;
      left: 0;
      right: 0;
      display: grid;
      justify-items: center;
    }

    .main-label {
      color: var(--muted);
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 13px;
      line-height: 1;
    }

    .main-number {
      margin-top: 4px;
      color: var(--text);
      font-size: 68px;
      line-height: 0.9;
      font-weight: 760;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }

    .main-number span {
      color: var(--muted);
      font-size: 26px;
      font-weight: 650;
    }

    .reset {
      margin-top: 7px;
      color: var(--accent);
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 13px;
    }

    .pet-stage {
      position: absolute;
      top: 174px;
      left: 50%;
      width: 104px;
      height: 92px;
      translate: -50% 0;
      overflow: visible;
    }

    .pet {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 192px;
      height: 208px;
      background-image: var(--sprite);
      background-repeat: no-repeat;
      background-size: 1536px 1872px;
      background-position: 0 calc(var(--pet-row) * -208px);
      transform: translateX(-50%) scale(0.36);
      transform-origin: center bottom;
      filter: drop-shadow(0 0 8px rgba(46,156,255,0.38));
      animation: petFrames var(--pet-duration) steps(var(--pet-frames)) infinite;
    }

    .chips {
      position: absolute;
      top: 174px;
      left: 66px;
      right: 66px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .chip {
      width: 86px;
      color: var(--muted);
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 10px;
      line-height: 1.2;
    }

    .chip strong {
      display: block;
      margin-top: 2px;
      color: #bfe7ff;
      font-size: 12px;
      font-weight: 700;
    }

    .metrics {
      position: absolute;
      left: 58px;
      right: 58px;
      bottom: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .metric-tile {
      min-height: 48px;
      padding: 8px 10px 9px;
      border-radius: 8px;
      background: rgba(7, 16, 20, 0.88);
      box-shadow: inset 0 0 0 1px rgba(127, 161, 173, 0.15);
      color: var(--text);
      font-family: Consolas, "Cascadia Mono", monospace;
      position: relative;
      overflow: hidden;
    }

    .metric-tile::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--tile-accent, var(--blue));
    }

    .metric-head {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      line-height: 1;
    }

    .metric-head .name {
      color: var(--muted);
    }

    .metric-head .value {
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .bar {
      margin-top: 8px;
      height: 8px;
      border-radius: 999px;
      background: #102832;
      overflow: hidden;
    }

    .fill {
      display: block;
      height: 100%;
      width: var(--w);
      border-radius: inherit;
      background: var(--accent);
      box-shadow: 0 0 10px color-mix(in srgb, var(--accent), transparent 45%);
    }

    .fill.blue {
      background: var(--blue);
    }

    .fill.red {
      background: var(--red);
    }

    .legend {
      width: 280px;
      display: grid;
      gap: 10px;
    }

    .legend h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.2;
    }

    .legend p {
      margin: 0 0 8px;
      color: #53616a;
      font-size: 14px;
      line-height: 1.5;
    }

    .legend-row {
      min-height: 46px;
      display: grid;
      grid-template-columns: 92px 1fr;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 1px 0 rgba(0,0,0,0.08);
    }

    .legend-row strong {
      color: #182025;
    }

    .legend-row span {
      color: #65727b;
      font-size: 13px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      border: 0;
      min-height: 40px;
      border-radius: 8px;
      background: #fff;
      color: #182025;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(0,0,0,0.08);
    }

    button.active {
      box-shadow: inset 0 0 0 2px var(--blue);
      color: #0a62c9;
      font-weight: 700;
    }

    @keyframes petFrames {
      from { background-position-x: 0; }
      to { background-position-x: calc(var(--pet-frames) * -192px); }
    }

    [data-state="ready"] {
      --accent: var(--green);
      --session-left: 89;
      --session-used: 11;
      --pet-row: 0;
      --pet-frames: 6;
      --pet-duration: 1150ms;
    }

    [data-state="working"] {
      --accent: var(--blue);
      --session-left: 63;
      --session-used: 37;
      --pet-row: 7;
      --pet-frames: 6;
      --pet-duration: 820ms;
    }

    [data-state="caution"] {
      --accent: var(--amber);
      --session-left: 28;
      --session-used: 72;
      --pet-row: 8;
      --pet-frames: 6;
      --pet-duration: 1120ms;
    }

    [data-state="low"] {
      --accent: var(--red);
      --session-left: 9;
      --session-used: 91;
      --pet-row: 5;
      --pet-frames: 8;
      --pet-duration: 1320ms;
    }
  </style>
</head>
<body data-state="ready">
  <main class="wrap">
    <section class="watch" aria-label="Clean Codex watch dashboard">
      <div class="screen">
        <div class="ring" aria-hidden="true">
          <svg viewBox="0 0 220 90" role="presentation">
            <path class="ring-bg" pathLength="100" d="M20 82 A70 70 0 0 1 200 82"></path>
            <path class="ring-used" pathLength="100" d="M20 82 A70 70 0 0 1 200 82"></path>
          </svg>
        </div>
        <div class="top">
          <div class="brand">Codex</div>
        </div>

        <section class="hero">
          <div class="main-label">5H LEFT</div>
          <div class="main-number"><span id="mainValue">89</span><span>%</span></div>
          <div class="reset" id="reset">RESET 1h52m</div>
        </section>

        <div class="chips">
          <div class="chip">MODEL<strong>gpt-5.5</strong></div>
          <div class="chip" style="text-align:right">EFFORT<strong id="effort">XHIGH</strong></div>
        </div>

        <div class="pet-stage" aria-hidden="true">
          <div class="pet"></div>
        </div>

        <section class="metrics">
          <div class="metric-tile" style="--tile-accent: var(--red)">
            <div class="metric-head"><div class="name">5H USED</div><div class="value" id="usedValue">11%</div></div>
            <div class="bar"><span class="fill red" id="usedBar" style="--w: 11%"></span></div>
          </div>
          <div class="metric-tile" style="--tile-accent: var(--blue)">
            <div class="metric-head"><div class="name">WEEK</div><div class="value" id="weekValue">98%</div></div>
            <div class="bar"><span class="fill blue" id="weekBar" style="--w: 98%"></span></div>
          </div>
          <div class="metric-tile" style="--tile-accent: var(--blue)">
            <div class="metric-head"><div class="name">TODAY</div><div class="value" id="todayValue">403K</div></div>
            <div class="bar"><span class="fill blue" id="todayBar" style="--w: 40%"></span></div>
          </div>
          <div class="metric-tile" style="--tile-accent: var(--blue)">
            <div class="metric-head"><div class="name">7D</div><div class="value" id="sevenValue">2.5M</div></div>
            <div class="bar"><span class="fill blue" id="sevenBar" style="--w: 72%"></span></div>
          </div>
        </section>
      </div>
    </section>

    <aside class="legend">
      <h1>V3 干净仪表盘</h1>
      <p>减少装饰线，只保留一个主状态环。每个数字都明确标注剩余、已用或统计周期。</p>
      <div class="legend-row"><strong>5H LEFT</strong><span>当前 5 小时额度剩余</span></div>
      <div class="legend-row"><strong>USED</strong><span>当前窗口已用百分比</span></div>
      <div class="legend-row"><strong>WEEK</strong><span>周额度剩余百分比</span></div>
      <div class="legend-row"><strong>TODAY / 7D</strong><span>本地 Codex token 统计</span></div>
      <div class="controls">
        <button class="active" data-set="ready">Ready</button>
        <button data-set="working">Working</button>
        <button data-set="caution">Caution</button>
        <button data-set="low">Low</button>
      </div>
    </aside>
  </main>

  <script>
    const states = {
      ready: { left: 89, used: 11, week: 98, effort: "XHIGH", reset: "RESET 1h52m", today: "403K", seven: "2.5M" },
      working: { left: 63, used: 37, week: 96, effort: "HIGH", reset: "SYNC NOW", today: "421K", seven: "2.6M" },
      caution: { left: 28, used: 72, week: 61, effort: "MED", reset: "RESET 42m", today: "880K", seven: "3.1M" },
      low: { left: 9, used: 91, week: 34, effort: "LOW", reset: "RESET 18m", today: "1.2M", seven: "3.8M" }
    };

    const buttons = [...document.querySelectorAll("button[data-set]")];
    const body = document.body;
    const mainValue = document.getElementById("mainValue");
    const reset = document.getElementById("reset");
    const effort = document.getElementById("effort");
    const usedBar = document.getElementById("usedBar");
    const usedValue = document.getElementById("usedValue");
    const weekBar = document.getElementById("weekBar");
    const weekValue = document.getElementById("weekValue");
    const todayValue = document.getElementById("todayValue");
    const sevenValue = document.getElementById("sevenValue");

    function applyState(name) {
      const next = states[name];
      body.dataset.state = name;
      body.style.setProperty("--session-used", next.used);
      mainValue.textContent = next.left;
      reset.textContent = next.reset;
      effort.textContent = next.effort;
      usedBar.style.setProperty("--w", `${next.used}%`);
      usedValue.textContent = `${next.used}%`;
      weekBar.style.setProperty("--w", `${next.week}%`);
      weekValue.textContent = `${next.week}%`;
      todayValue.textContent = next.today;
      sevenValue.textContent = next.seven;
      buttons.forEach((button) => button.classList.toggle("active", button.dataset.set === name));
    }

    buttons.forEach((button) => {
      button.addEventListener("click", () => applyState(button.dataset.set));
    });
  </script>
</body>
</html>
